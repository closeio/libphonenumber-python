[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "cython>=0.29.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "phonenumbers"
version = "10.1.0"
description = "Python bindings for Google's libphonenumber library"
authors = [
    {name = "Alec", email = "example@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Telephony",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/libphonenumber-bindings"
"Bug Tracker" = "https://github.com/yourusername/libphonenumber-bindings/issues"

[tool.setuptools.package-data]
phonenumbers = ["py.typed", "*.pyi"]