[build-system]
requires = [
  "pybind11>=3.0.4,<4",
  "scikit-build-core>=0.10.7,<1",
]
build-backend = "scikit_build_core.build"

[project]
name = "closeio-phonenumbers"
version = "9.0.34.1"
description = "Low-memory Python bindings for Google's libphonenumber"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {file = "LICENSE"}
keywords = ["libphonenumber", "phone", "phonenumber", "telephony"]
authors = [
  {name = "Close", email = "engineering@close.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Telephony",
  "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/closeio/libphonenumber-python#readme"
Homepage = "https://github.com/closeio/libphonenumber-python"
Issues = "https://github.com/closeio/libphonenumber-python/issues"
Source = "https://github.com/closeio/libphonenumber-python"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = [
  "build>=1,<2",
  "mypy==2.3.0",
  "pytest>=8,<10",
  "ruff==0.15.17",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
minimum-version = "build-system.requires"
sdist.exclude = ["build", "dist", "wheelhouse", ".git"]
sdist.include = [
  "vendor/abseil-cpp-273292d.tar.gz",
  "vendor/libphonenumber-9.0.34.tar.gz",
]
wheel.packages = ["src/phonenumbers"]

[tool.cibuildwheel]
build = [
  "cp312-manylinux*",
  "cp312-macosx*",
  "cp313-manylinux*",
  "cp313-macosx*",
  "cp314-manylinux*",
  "cp314-macosx*",
]
skip = ["*-manylinux_i686", "*-musllinux*"]
test-command = "pytest {project}/tests"
test-requires = ["pytest>=8,<10"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
before-all = "dnf install -y libicu-devel protobuf-compiler protobuf-devel"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
before-all = "brew install icu4c pkg-config protobuf"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "15.0"
CMAKE_PREFIX_PATH = "$(brew --prefix icu4c):$(brew --prefix protobuf)"
PKG_CONFIG_PATH = "$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix protobuf)/lib/pkgconfig"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
