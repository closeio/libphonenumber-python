services:
  phonenumber-py:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    # By default, just show a message about using the test script
    command: >
      bash -c "echo 'Welcome to the libphonenumber-bindings development environment!' &&
              echo 'For running tests, please use ./run_tests.sh on your host system.' &&
              echo 'To explore the container, run: ./run-in-docker.sh bash' &&
              echo '' &&
              echo 'Container is now exiting. Use ./run-in-docker.sh to run specific commands.'"