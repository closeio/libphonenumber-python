name: Build and test

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install mypy==2.3.0 ruff==0.15.17
      - run: ruff check src/phonenumbers tests tools
      - run: ruff format --check src/phonenumbers tests tools
      - run: mypy --strict src/phonenumbers

  linux-wheels:
    name: Linux / ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Fetch pinned libphonenumber source
        run: python tools/fetch_libphonenumber.py

      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos-wheels:
    name: macOS / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch pinned libphonenumber source
        run: python tools/fetch_libphonenumber.py

      - uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch pinned libphonenumber source
        run: python tools/fetch_libphonenumber.py
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  tz-trout:
    name: Downstream / CPython ${{ matrix.python }}
    needs: linux-wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: wheelhouse
      - uses: actions/checkout@v6
        with:
          repository: closeio/tz-trout
          ref: 2142e66469cf75bf7f663a4f69f0d10dc6292ea8
          path: tz-trout
      - name: Install native wheel and tz-trout test dependencies
        run: |
          python -m pip install --no-index --find-links wheelhouse \
            closeio-phonenumbers
          python -m pip install --no-deps ./tz-trout
          python -m pip install -r tz-trout/requirements_test.txt \
            pytz==2025.2 python-dateutil==2.8.2 timezonefinder==8.1.0
      - name: Verify the native distribution owns the import
        run: |
          python -m pip show closeio-phonenumbers
          if python -m pip show phonenumbers; then
            echo "Both phone-number distributions are installed"
            exit 1
          fi
      - name: Run tz-trout tests
        run: python -m pytest -q tz-trout/tests

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, linux-wheels, macos-wheels, sdist, tz-trout]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Verify release artifacts
        run: |
          test -f "dist/closeio_phonenumbers-${GITHUB_REF_NAME#v}.tar.gz"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 12
      - uses: pypa/gh-action-pypi-publish@release/v1
